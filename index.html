<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Chess - Xiangqi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <h1>中國象棋</h1>
            <h2>Chinese Chess</h2>
            
            <div id="game-status">
                <div id="turn-indicator">
                    <span id="turn-text">Red's Turn</span>
                    <span id="turn-piece" class="piece-indicator red">帥</span>
                </div>
            </div>
            
            <div id="music-toggle">
                <button id="music-btn">Music: Off</button>
            </div>
            
            <div id="controls">
                <button id="new-game-btn">New Game</button>
                <button id="undo-btn">Undo Move</button>
                <button id="flip-board-btn">Flip Board</button>
            </div>
            
            <div id="difficulty">
                <label>AI Difficulty:</label>
                <select id="ai-depth">
                    <option value="1">Easy (Depth 1)</option>
                    <option value="2" selected>Medium (Depth 2)</option>
                    <option value="3">Hard (Depth 3)</option>
                    <option value="4">Expert (Depth 4)</option>
                </select>
            </div>
            
            <div id="mode-toggle">
                <button id="mode-hr-cb" class="active">Human Red vs Computer Black</button>
                <button id="mode-cr-hb">Computer Red vs Human Black</button>
                <button id="mode-hr-hb">Human Red vs Human Black</button>
                <button id="mode-cr-cb">Computer Red vs Computer Black</button>
            </div>
        </div>
        
        <div id="board-container">
            <canvas id="board"></canvas>
            <div id="captured-pieces">
                <div id="red-captured">
                    <h4>Red Captured</h4>
                    <div id="red-captured-list"></div>
                </div>
                <div id="black-captured">
                    <h4>Black Captured</h4>
                    <div id="black-captured-list"></div>
                </div>
            </div>
        </div>
        
        <div id="notation-panel">
            <h3>Moves</h3>
            <div id="notation-toggle">
                <button id="notation-btn">Notation: 中文</button>
            </div>
            <div id="moves-row">
                <div id="eval-bar">
                    <div id="eval-red-fill"></div>
                    <div id="eval-black-fill"></div>
                </div>
                <div id="notation-table-wrap">
                    <table id="notation-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th class="red-col">Red</th>
                                <th class="black-col">Black</th>
                            </tr>
                        </thead>
                        <tbody id="notation-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div id="utility-panel">
            <div id="launch-options">
                <h3>Launch Options</h3>
                <button id="standard-btn">Standard Game</button>
                <button id="setup-btn">Bespoke Setup</button>
                <button id="examples-btn">Endgame Examples</button>
            </div>
            
            <div id="setup-panel" class="hidden">
                <h3>Position Setup</h3>
                <p id="setup-message"></p>
                <div id="setup-palette"></div>
                <button id="setup-eraser-btn" class="setup-util-btn">Eraser (Remove Piece)</button>
                <div id="setup-actions">
                    <button id="setup-clear-btn" class="setup-util-btn">Clear Board</button>
                    <button id="setup-standard-btn" class="setup-util-btn">Standard Start</button>
                </div>
                <div id="setup-turn">
                    <button id="setup-turn-red-btn">Red to Move</button>
                    <button id="setup-turn-black-btn">Black to Move</button>
                </div>
                <div id="setup-commit">
                    <button id="setup-start-btn">Start Game</button>
                    <button id="setup-cancel-btn">Cancel</button>
                </div>
            </div>
            
            <div id="examples-panel" class="hidden">
                <h3>Endgame Examples</h3>
                <div id="study-list">
                    <button class="study-btn" data-study="0">1. Basic Checkmate</button>
                    <button class="study-btn" data-study="1">2. Chariot & Horse</button>
                    <button class="study-btn" data-study="2">3. Cannon Mate</button>
                    <button class="study-btn" data-study="3">4. Double Cannon</button>
                    <button class="study-btn" data-study="4">5. Horse & Cannon</button>
                    <button class="study-btn" data-study="5">6. Chariot Mate</button>
                </div>
                <p id="study-description"></p>
            </div>
        </div>
    </div>
    
    <audio id="bg-music" loop preload="auto">
        <source src="music/Qiu_Feng_Ci.ogg" type="audio/ogg">
    </audio>
    
    <div id="game-over-overlay" class="hidden">
        <div id="game-over-modal">
            <h2 id="game-over-title">Checkmate!</h2>
            <p id="game-over-message">Red Wins!</p>
            <button id="game-over-btn">Play Again</button>
        </div>
    </div>
    
    <script src="board.js"></script>
    <script src="rules.js"></script>
    <script src="move.js"></script>
    <script src="ai.js"></script>
    <script src="render.js"></script>
    <script src="examples/endgame_examples.js"></script>
    <script src="main.js"></script>
</body>
</html>
